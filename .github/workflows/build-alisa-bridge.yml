name: Build experimental Alisa Voice ARMhf bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout original Alisa Voice sources
        uses: actions/checkout@v4
        with:
          repository: rison1337/Alisa-ChatGPT-voice-assistant
          ref: main
          path: source
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build make perl clang lld llvm curl xz-utils ca-certificates python3 tar file pkg-config


      - name: Download pinned dependency source bundle
        working-directory: source
        run: |
          set -euo pipefail
          BASE=https://github.com/rison1337/Alisa-ChatGPT-voice-assistant/releases/download/v0.2.0
          curl -fL --retry 3 "$BASE/alisa-voice-sources.tar.gz" -o alisa-voice-sources.tar.gz
          curl -fL --retry 3 "$BASE/alisa-voice-sources.tar.gz.sha256" -o alisa-voice-sources.tar.gz.sha256
          sha256sum -c alisa-voice-sources.tar.gz.sha256
          tar -xzf alisa-voice-sources.tar.gz --strip-components=1

      - name: Download pinned Zig 0.14.1
        working-directory: source
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz' -o zig.tar.xz
          echo '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  zig.tar.xz' | sha256sum -c -
          mkdir -p engines/native/toolchains
          tar -xJf zig.tar.xz -C engines/native/toolchains

      - name: Compile ARMhf client
        working-directory: source
        run: |
          set -euo pipefail
          python3 engines/native/scripts/build_native.py --jobs 2
          cmake -S engines/native -B engines/native/build/client -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/engines/native/build/arm/toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DALISA_USE_NETEQ=ON
          cmake --build engines/native/build/client --target alisa-standalone --parallel 2
          test -s engines/native/build/client/alisa-standalone
          file engines/native/build/client/alisa-standalone
          sha256sum engines/native/build/client/alisa-standalone

      - name: Upload test executable (do not install yet)
        uses: actions/upload-artifact@v4
        with:
          name: alisa-standalone-armhf-experimental
          path: source/engines/native/build/client/alisa-standalone
          if-no-files-found: error
          retention-days: 3

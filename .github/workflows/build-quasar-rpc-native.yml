      - name: Host protocol tests (no station)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -o /tmp/quasar-rpc-probe-host /tmp/quasar_rpc_probe.c
          NATIVE_TEST_BINARY=/tmp/quasar-rpc-probe-host python3 /tmp/test_protocol.py
      - name: Cross compile ARMhf static
        run: |
          mkdir -p out
          arm-linux-gnueabihf-gcc -std=c11 -static -Os -Wall -Wextra -Werror -o out/quasar-rpc-probe-armhf /tmp/quasar_rpc_probe.c
          file out/quasar-rpc-probe-armhf
          (cd out && sha256sum quasar-rpc-probe-armhf > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: quasar-rpc-probe-armhf
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Add passive assistant caption marker probe
        shell: bash
        run: |
          cat > bridge-patch/apply_marker_probe.py <<'PATCH_MARKER_PROBE'
          #!/usr/bin/env python3
          """Augment v2 Alisa Voice patch with passive assistant text marker telemetry.
          
          No system command execution, no raw text logs, no session data persistence.
          """
          import sys
          from pathlib import Path
          
          if len(sys.argv)!=2: sys.exit('Usage: apply_marker_probe.py /path/to/source')
          f=Path(sys.argv[1])/'engines/native/native/voice_call.hpp'
          s=f.read_text(encoding='utf-8')
          if 'ALISA_ASSISTANT_MARKER_PROBE_V1' in s: sys.exit('Already patched')
          if 'ALICE_VOICE_BRIDGE_V2' not in s: sys.exit('V2 base patch required')
          
          probe = r'''    // ALISA_ASSISTANT_MARKER_PROBE_V1
              // Observe ONLY assistant-authored text in memory; never log captions or act.
              std::string marker_role, marker_id, marker_buffer;
              unsigned int marker_fragments=0, marker_total_bytes=0;
              bool marker_seen=false;
              static std::string marker_piece(const json &value) {
                  if(value.is_string())return value.get<std::string>();
                  if(!value.is_object())return {};
                  for(const char *key:{"text","content","transcript"})
                      if(value.contains(key)&&value[key].is_string())return value[key].get<std::string>();
                  return {};
              }
              static std::string marker_parts(const json &content) {
                  if(content.is_string())return content.get<std::string>();
                  if(!content.is_object())return {};
                  if(content.contains("parts")&&content["parts"].is_array()) {
                      std::string result;
                      for(const auto &part:content["parts"]) {
                          std::string piece=marker_piece(part);
                          if(result.size()+piece.size()>4096)break;
                          result+=piece;
                      }
                      return result;
                  }
                  return marker_piece(content);
              }
              void marker_analyze() {
                  if(alice_voice_bridge::lower_ru(marker_buffer).find("сиреневый спутник")!=std::string::npos)
                      marker_seen=true;
              }
              void marker_snapshot(const std::string &text) {
                  if(marker_role!="assistant"||text.empty()||text.size()>4096||text==marker_buffer)return;
                  marker_buffer=text;
                  ++marker_fragments;
                  marker_total_bytes+=static_cast<unsigned int>(text.size());
                  marker_analyze();
              }
              void marker_append(const std::string &text) {
                  if(marker_role!="assistant"||text.empty()||marker_buffer.size()+text.size()>4096)return;
                  marker_buffer+=text;
                  ++marker_fragments;
                  marker_total_bytes+=static_cast<unsigned int>(text.size());
                  marker_analyze();
              }
              void marker_set_id(const json &value) {
                  if(!value.is_string())return;
                  std::string next=value.get<std::string>();
                  if(next.empty()||next.size()>128)return;
                  if(marker_id!=next){marker_id=next;marker_role.clear();marker_buffer.clear();}
              }
              void marker_message(const json &msg) {
                  if(!msg.is_object())return;
                  if(msg.contains("id"))marker_set_id(msg["id"]);
                  if(msg.contains("author")&&msg["author"].is_object())
                      marker_role=msg["author"].value("role",std::string());
                  if(marker_role=="assistant"&&msg.contains("content"))
                      marker_snapshot(marker_parts(msg["content"]));
              }
              void marker_observe(const std::string &kind,const json &payload) {
                  if(kind!="chat_message_delta"||!payload.is_object()||
                     !payload.contains("delta")||!payload["delta"].is_object())return;
                  const json &delta=payload["delta"];
                  if(!delta.contains("v"))return;
                  const json &v=delta["v"];
                  if(v.is_object()) {
                      if(v.contains("message"))marker_message(v["message"]);
                      else marker_message(v);
                  } else if(v.is_array()) {
                      for(const auto &op:v) {
                          if(!op.is_object()||!op.contains("p")||!op["p"].is_string()||
                             !op.contains("v"))continue;
                          const std::string path=op["p"].get<std::string>();
                          const json &value=op["v"];
                          if(path=="/message") {marker_message(value);continue;}
                          if(path=="/message/id") {marker_set_id(value);continue;}
                          if(path=="/message/author") {
                              if(value.is_object())marker_role=value.value("role",std::string());
                              continue;
                          }
                          if(path=="/message/author/role") {
                              if(value.is_string())marker_role=value.get<std::string>();
                              continue;
                          }
                          if(marker_role!="assistant")continue;
                          const std::string operation=op.value("o",std::string());
                          if(path=="/message/content"||path=="/message/content/parts") {
                              if(path=="/message/content")marker_snapshot(marker_parts(value));
                              else if(value.is_array())marker_snapshot(marker_parts(json{{"parts",value}}));
                              continue;
                          }
                          if(path.rfind("/message/content/parts/",0)!=0)continue;
                          const std::string piece=marker_piece(value);
                          if(operation=="append")marker_append(piece);
                          else if(operation=="add"||operation=="replace")marker_snapshot(piece);
                      }
                  } else if(v.is_string())marker_append(v.get<std::string>());
              }
          '''
          changes=[
              ('    // ALICE_VOICE_BRIDGE_V2: inspect only user-authored captions;',
               probe+'\n    // ALICE_VOICE_BRIDGE_V2: inspect only user-authored captions;'),
              ('                bridge_observe(kind,payload);',
               '                bridge_observe(kind,payload);\n                marker_observe(kind,payload);'),
              ('{"alice_bridge",{{"user_text_seen",alice_bridge.seen_count()},',
               '{"assistant_marker_probe",{{"assistant_text_fragments",marker_fragments},\n'
               '                                       {"assistant_text_bytes",marker_total_bytes},\n'
               '                                       {"marker_seen",marker_seen}}},\n'
               '            {"alice_bridge",{{"user_text_seen",alice_bridge.seen_count()},'),
          ]
          for old,new in changes:
              n=s.count(old)
              if n!=1:sys.exit(f'Expected exactly one anchor, got {n}: {old[:80]}')
              s=s.replace(old,new,1)
          f.write_text(s,encoding='utf-8')
          print('ALISA_ASSISTANT_MARKER_PROBE_V1 applied; readonly stats only')
          PATCH_MARKER_PROBE
          python3 bridge-patch/apply_marker_probe.py source
          grep -q ALISA_ASSISTANT_MARKER_PROBE_V1 source/engines/native/native/voice_call.hpp
          grep -q '"assistant_marker_probe"' source/engines/native/native/voice_call.hpp

      - name: Add passive assistant decision probe (retain last assistant output)
        shell: bash
        run: |
          cat > bridge-patch/apply_decision_probe_fixed.py <<'PATCH_DECISION_PROBE_FIXED'
          #!/usr/bin/env python3
          '''Keep a bounded copy of the last assistant text across later message ID/role changes.
          No command execution and no raw-text telemetry.
          '''
          import sys
          from pathlib import Path
          if len(sys.argv)!=2:
              sys.exit('Usage: python3 apply_decision_probe_fixed.py /path/to/source')
          f=Path(sys.argv[1])/'engines/native/native/voice_call.hpp'
          s=f.read_text(encoding='utf-8')
          if 'ALISA_DECISION_PROBE_V2' in s:
              sys.exit('Decision V2 already applied')
          if 'ALISA_ASSISTANT_MARKER_PROBE_V1' not in s:
              sys.exit('Marker probe must be applied first')
          changes=[
          ('    bool marker_seen=false;',r'''    bool marker_seen=false;
              // ALISA_DECISION_PROBE_V2: keep the latest assistant text independently
              // of the current message ID and role. Observe only; never dispatch.
              std::string decision_last_assistant_text;
              unsigned int decision_text_updates=0;
              void decision_retain() {
                  if(marker_role!="assistant"||marker_buffer.empty())return;
                  decision_last_assistant_text=marker_buffer;
                  ++decision_text_updates;
              }
              static std::string decision_trim(const std::string &s) {
                  const size_t first=s.find_first_not_of(" \r\n\t");
                  if(first==std::string::npos)return {};
                  const size_t last=s.find_last_not_of(" \r\n\t");
                  return s.substr(first,last-first+1);
              }
              std::string decision_code() const {
                  if(decision_last_assistant_text.empty())return "no_assistant_text";
                  const std::string output=decision_trim(decision_last_assistant_text);
                  if(output=="[[STATION_V1:play:amon_amarth]]")return "play";
                  if(output=="[[STATION_V1:none]]")return "none";
                  return "unrecognized";
              }'''),
          ('''        marker_analyze();
              }
              void marker_append''','''        marker_analyze();
                  decision_retain();
              }
              void marker_append'''),
          ('''        marker_analyze();
              }
              void marker_set_id''','''        marker_analyze();
                  decision_retain();
              }
              void marker_set_id'''),
          ('''{"assistant_marker_probe",{{"assistant_text_fragments",marker_fragments},''','''{"assistant_decision_probe",{{"final_choice",decision_code()},
                                                   {"assistant_updates",decision_text_updates},
                                                   {"saved_text_bytes",decision_last_assistant_text.size()},
                                                   {"device_dispatch_attempts",0}}},
                      {"assistant_marker_probe",{{"assistant_text_fragments",marker_fragments},''')
          ]
          for old,new in changes:
              n=s.count(old)
              if n!=1:sys.exit(f'Anchor mismatch {n}: {old[:80]!r}')
              s=s.replace(old,new,1)
          f.write_text(s,encoding='utf-8')
          print('ALISA_DECISION_PROBE_V2 applied, snapshot retained, passive only')
          PATCH_DECISION_PROBE_FIXED
          python3 bridge-patch/apply_decision_probe_fixed.py source
          grep -q ALISA_DECISION_PROBE_V2 source/engines/native/native/voice_call.hpp
          grep -q '"assistant_decision_probe"' source/engines/native/native/voice_call.hpp

      - name: Test persistent decision capture
        shell: bash
        run: |
          cat > /tmp/test-decision-fixed.cpp <<'TEST_DECISION_CPP'
          #include <string>
          #include <cassert>
          struct Probe {
            std::string marker_role,marker_buffer,decision_last_assistant_text;
            unsigned decision_text_updates=0;
            void decision_retain(){
              if(marker_role!="assistant"||marker_buffer.empty())return;
              decision_last_assistant_text=marker_buffer; ++decision_text_updates;
            }
            void snapshot(const std::string &text){
              if(marker_role!="assistant")return;
              marker_buffer=text;decision_retain();
            }
            static std::string trim(const std::string &s){
              auto f=s.find_first_not_of(" \r\n\t"); if(f==std::string::npos)return {};
              auto l=s.find_last_not_of(" \r\n\t");return s.substr(f,l-f+1);
            }
            std::string decision_code() const {
              if(decision_last_assistant_text.empty())return "no_assistant_text";
              auto v=trim(decision_last_assistant_text);
              if(v=="[[STATION_V1:play:amon_amarth]]")return "play";
              if(v=="[[STATION_V1:none]]")return "none";
              return "unrecognized";
            }
          };
          int main(){
           Probe p;
           assert(p.decision_code()=="no_assistant_text");
           p.marker_role="assistant";
           p.snapshot("  [[STATION_V1:play:amon_amarth]]\r\n");
           assert(p.decision_code()=="play");
           p.marker_role="user";p.marker_buffer.clear();
           assert(p.decision_code()=="play");
           p.marker_role="assistant";p.snapshot("[[STATION_V1:none]]");
           assert(p.decision_code()=="none");
           p.marker_role="user";p.marker_buffer.clear();
           assert(p.decision_code()=="none");
           p.marker_role="assistant";p.snapshot("Sure: [[STATION_V1:play:amon_amarth]]");
           assert(p.decision_code()=="unrecognized");
           assert(p.decision_text_updates==3);
          }
          TEST_DECISION_CPP
          g++ -std=c++17 -Wall -Wextra -Werror /tmp/test-decision-fixed.cpp -o /tmp/test-decision-fixed
          /tmp/test-decision-fixed

      - name: Test bridge parser and fragment assembly on runner
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -I bridge-patch bridge-patch/test_bridge.cpp -o /tmp/test-alice-bridge
          /tmp/test-alice-bridge

      - name: Download pinned dependency source bundle
        working-directory: source
        run: |
          set -euo pipefail
          BASE=https://github.com/rison1337/Alisa-ChatGPT-voice-assistant/releases/download/v0.2.0
          curl -fL --retry 3 "$BASE/alisa-voice-sources.tar.gz" -o alisa-voice-sources.tar.gz
          curl -fL --retry 3 "$BASE/alisa-voice-sources.tar.gz.sha256" -o alisa-voice-sources.tar.gz.sha256
          sha256sum -c alisa-voice-sources.tar.gz.sha256
          tar -xzf alisa-voice-sources.tar.gz --strip-components=1

      - name: Download pinned Zig 0.14.1
        working-directory: source
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz' -o zig.tar.xz
          echo '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  zig.tar.xz' | sha256sum -c -
          mkdir -p engines/native/toolchains
          tar -xJf zig.tar.xz -C engines/native/toolchains

      - name: Compile ARMhf client
        working-directory: source
        run: |
          set -euo pipefail
          python3 engines/native/scripts/build_native.py --jobs 2
          cmake -S engines/native -B engines/native/build/client -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/engines/native/build/arm/toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DALISA_USE_NETEQ=ON
          cmake --build engines/native/build/client --target alisa-standalone --parallel 2
          test -s engines/native/build/client/alisa-standalone
          file engines/native/build/client/alisa-standalone
          sha256sum engines/native/build/client/alisa-standalone
          sha256sum engines/native/build/client/alisa-standalone > engines/native/build/client/alisa-standalone.sha256

      - name: Upload test executable (do not install yet)
        uses: actions/upload-artifact@v4
        with:
          name: alisa-standalone-armhf-decision-probe-fixed
          path: |
            source/engines/native/build/client/alisa-standalone
            source/engines/native/build/client/alisa-standalone.sha256
          if-no-files-found: error
          retention-days: 3
